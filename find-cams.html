<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<title>Find Cams — 4XS Toolbox</title>
<link rel="stylesheet" href="find-cams.css">
<style>
  :root { --bg:#ffffff; --text:#1a1a1a; --muted:#666; --border:#ddd; --accent:#ffcc33; --accent-strong:#e0b400; --accent-ink:#1a1a1a; --row-hover:#fff8e0; --header-bg:#fafafa }
  [data-theme="dark"] { --bg:#1c1c1c; --text:#eee; --muted:#aaa; --border:#3a3a3a; --row-hover:#2c2a20; --header-bg:#222 }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text) }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:3px solid var(--accent); background:var(--header-bg) }
  h1 { font-size:16px; margin:0; font-weight:700 } h1 .version { font-weight:400; color:var(--muted); font-size:12px; margin-left:6px }
  .grow { flex:1 }
  #themeToggle { border:1px solid var(--border); background:var(--bg); color:var(--text); padding:6px 10px; border-radius:4px; cursor:pointer; font:inherit }
  #findCams { max-width: 720px; margin: 8px auto; font-size: 14px }
</style>
</head>
<body>
<header>
  <h1><span id="pageHeadingText">Find Axis cameras on this network</span><span class="version" id="versionLabel"></span></h1>
  <div class="grow"></div>
  <button id="themeToggle" title="Toggle light/dark theme">🌓</button>
</header>
<div id="findCams"></div>
<script src="i18n.js"></script>
<script src="chipset-data.js"></script>
<script src="find-cams.js"></script>
<script src="find-cams-page.js"></script>
</body>
</html>
