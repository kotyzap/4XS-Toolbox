<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>4XS Toolbox</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e4e4e4;
    --row-hover: #f7f7f7;
    /* Axis Yellow - the same brand color used for price/chipset badges on
       the Product Selector and search results, so the popup reads as part
       of the same family instead of its own separate red-accented UI. */
    --accent: #ffcc33;
    --accent-strong: #e0b400;
    --accent-ink: #1a1a1a;
    --header-bg: #1a1a1a;
    --header-text: #ffffff;
    --header-muted: #b8b8b8;
    /* Kept separate from --accent so real failures still read as errors
       rather than blending into the brand yellow. */
    --error: #c8102e;
  }
  [data-theme="dark"] {
    --bg: #1c1c1c;
    --text: #f0f0f0;
    --muted: #a0a0a0;
    --border: #333333;
    --row-hover: #2a2a2a;
    --header-bg: #0f0f0f;
    --error: #ff5c72;
  }
  * { box-sizing: border-box; }
  body {
    /* Fixed width, fixed-height view area below (see .view-area) - the
       popup's own window dimensions never change after this, which is
       what actually avoids Chrome's extension-popup shrink bug (it grows
       to fit content reliably but never re-measures itself smaller
       afterward). Catalogue / FOV Map / Find Camera are switched as
       single-column views (see .view-tabs / .view-area) instead of side
       columns that used to widen the whole popup. */
    width: 420px;
    display: flex;
    flex-direction: column;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 12px 14px;
    background: var(--header-bg);
    color: var(--header-text);
    border-bottom: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 14px;
    margin: 0;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  header .version {
    font-size: 10px;
    font-weight: 400;
    color: var(--header-muted);
  }
  header .sub {
    font-size: 11px;
    color: var(--header-muted);
    margin-top: 2px;
  }
  #themeToggle, #advancedBtn, #kofiBtn {
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: transparent;
    color: var(--header-text);
    border-radius: 6px;
    /* Icon-only now (used to be a single emoji character, sized with
       text padding) - equal padding centers the 18px icon in a small
       square button instead of the emoji's old wide/short pill. */
    padding: 5px;
    line-height: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #themeToggle svg, #advancedBtn svg, #kofiBtn svg { display: block; }
  .header-actions {
    display: flex;
    gap: 6px;
  }
  /* Search is the main control of this view, so it sits on the same
     tinted-yellow panel as the three tab buttons, with the plain input
     inside it - otherwise a bare 1px-bordered field reads as background. */
  .search-wrap {
    margin: 0 14px 10px;
    padding: 8px;
    background: rgba(255, 204, 51, 0.2);
    border: 1px solid var(--accent-strong);
    border-radius: 6px;
    /* Row so #filterBtnCatalog can sit beside the input without costing the
       popup any extra height - there are only ~25px left under Chrome's
       600px popup cap (see popup_fov_results.md). */
    display: flex;
    align-items: stretch;
    gap: 6px;
  }
  #search {
    flex: 1 1 auto;
    min-width: 0;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid var(--accent-strong);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  #search:focus {
    outline: 2px solid var(--accent-strong);
    outline-offset: 0;
  }
  #results {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 6px 8px;
  }
  .row {
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    /* Not a click target as a whole any more: the text fields copy their own
       value and the heart alone toggles the favorite. */
    cursor: default;
    /* Contains the floated .badges block. Without this the row is only as
       tall as its text column (model + meta), while the badge block needs
       two lines - so the OS 13 / compute line spilled over the divider and
       read as belonging to the next row. */
    display: flow-root;
  }
  /* Click-to-copy fields, same affordance as find-cams' .fc-copy. */
  .row .copy { cursor: copy; }
  .row .copy:hover { text-decoration: underline dotted; color: var(--text); }
  .row .copied::after { content: " ✓"; color: var(--accent-strong); font-weight: 700; }
  .row:hover { background: var(--row-hover); }
  .row.favorited { background: rgba(255, 145, 0, 0.08); }
  /* Thin divider between rows so a tightly-packed list still reads as
     separate entries. Sibling selector (not border-bottom on .row itself)
     so there's no stray line above the first row or below the last. */
  .row + .row { border-top: 1px solid var(--border); }
  .row .fav {
    float: right;
    display: inline-block;
    /* 3px margin + 3px padding keeps the old 6px gap while giving the heart -
       now the only favorite target - a bigger hit area than its 13px glyph. */
    margin-left: 3px;
    padding: 2px 3px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    /* Fixed content width, centered: "♡" and "🧡" aren't the same glyph
       width (measured 12px vs 16px at this font), so without this a
       favorited row's price/chipset shifted ~4px left of every other row -
       the same column-alignment problem as .price/.chipset below, just
       triggered by favoriting instead of by digit count. */
    width: 16px;
    text-align: center;
  }
  .row .model { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 11px; }
  .row .price {
    float: right;
    display: inline-block;
    padding: 1px 8px;
    border-radius: 3px;
    /* Matches .axis-product-price-badge's font-size on the live AXIS
       Product Selector pages (products-content.css), so the popup's price
       badges read the same size as the ones on axis.com itself. */
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-ink);
    background: rgba(255, 204, 51, 0.85);
    /* Fixed-ish width (not a hard cap - min-width, so a rare long fallback
       like "no EUR data" still fits) so every row reserves the same space
       here regardless of digit count. Measured against the catalog's real
       spread (headless): EUR is the widest currency at up to 77px
       ("€44,999.00"); 78px covers it with no clipping in USD/GBP/JPY either. */
    min-width: 78px;
    text-align: right;
    white-space: nowrap;
  }
  .row .chipset {
    float: right;
    display: inline-block;
    margin-right: 6px;
    padding: 1px 8px;
    border-radius: 3px;
    /* Matches .axis-product-chipset-badge's font-size on the live AXIS
       Product Selector pages (products-content.css). */
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    background: rgba(26, 26, 26, 0.85);
    white-space: nowrap;
    /* Fixed-ish width, left-aligned text: this is what actually lines up
       every chipset pill in the same column, since .price is now also a
       fixed width immediately to its right - two variable-width floats in a
       row can never share a stable left edge, only two fixed ones can.
       Measured against all 12 known chipsets (headless, incl. the ARTPEC
       CamStreamer-supported checkmark): 100px covers "Ambarella CV25/CV75"
       (84px of text) and "ARTPEC-6/7 ✅" (82px) with no clipping. */
    min-width: 100px;
    text-align: left;
  }
  footer {
    padding: 8px 14px 12px;
    font-size: 10.5px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  .empty { padding: 12px 14px; font-size: 12px; color: var(--muted); }

  .chipset-section {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }
  .chipset-section .row-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .chipset-section .label {
    font-size: 12px;
    font-weight: 600;
  }
  .chipset-section .status {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 4px;
  }
  .chipset-section .status.error {
    color: var(--error);
  }
  #refreshChipsets {
    border: 1px solid var(--accent-strong);
    background: rgba(255, 204, 51, 0.2);
    color: var(--accent-ink);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  #refreshChipsets:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #refreshChipsets:hover:not(:disabled) {
    background: var(--accent);
  }

  .currency-section {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .currency-section .label {
    font-size: 12px;
    font-weight: 600;
  }
  .currency-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .currency-toggle button {
    border: none;
    background: transparent;
    color: var(--text);
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .currency-toggle button + button {
    border-left: 1px solid var(--border);
  }
  .currency-toggle button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }
  /* Catalogue / FOV Map / Find Camera are switched here as single-column views
     inside one fixed-size popup (see .view-area below), instead of side
     columns that used to widen the whole popup window. Chrome's
     extension-popup auto-resize grows reliably to fit new content but has
     a longstanding, verified-unfixable-from-here bug where it never
     re-measures itself smaller afterward - so the fix is to never ask the
     popup to change size in the first place. The small 🗺 header icon is
     separate - it always opens the full-page fov-map.html tool, it
     doesn't switch views. */
  .view-tabs {
    display: flex;
    gap: 8px;
    margin: 10px 14px 0;
  }
  /* Quick links to axis.com, above the tab bar. Same tinted-panel look as
     the tabs but single-line and about half their height. */
  .link-row {
    /* Three equal outbound links plus the square category picker, which is
       sized to the row height rather than sharing a column - same shape as
       the row on toolbox.4xs.dev. */
    display: grid;
    grid-template-columns: repeat(3, 1fr) 26px;
    gap: 8px;
    margin: 10px 14px 0;
    align-items: stretch;
  }
  /* Square "+" that opens the category picker. Dashed, so it reads as an
     affordance rather than a fourth link. */
  .cat-pick-btn {
    width: 26px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--accent-strong);
    background: rgba(255, 204, 51, 0.12);
    color: var(--text);
    border-radius: 6px;
    font: 700 16px/1 Arial, sans-serif;
    cursor: pointer;
  }
  .cat-pick-btn:hover { background: rgba(255, 204, 51, 0.3); }
  /* Reuses .filter-pop (fixed, above everything) so opening it never changes
     the popup's height - the two-heights rule below still holds. */
  .cat-pick-pop .cat-pick-note {
    font-size: 10.5px;
    color: var(--muted);
    margin: 4px 2px 0;
  }
  .cat-pick-pop label.disabled { opacity: 0.45; cursor: default; }
  .link-row a {
    flex: 1 1 0;
    min-width: 0;
    /* Flex so the icon can sit beside the label; the label carries the
       ellipsis, since text-overflow does nothing on a flex container. */
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: 1px solid var(--accent-strong);
    background: rgba(255, 204, 51, 0.2);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 5px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
  }
  .link-row a svg,
  .cat-row a svg { flex: 0 0 auto; }
  .link-row a span,
  .cat-row a span { overflow: hidden; text-overflow: ellipsis; }
  .link-row a:hover {
    background: rgba(255, 204, 51, 0.35);
  }
  /* ---- Category quick links -----------------------------------------
     One row of up to 4 buttons, one per category hearted on
     axis.com/products. The row only exists when at least one is hearted,
     and it costs 28px there is no headroom for - so the list area pays
     for it via .axis-has-categories below. Capped at 4 (one line) so the
     popup only ever has two possible heights. */
  .cat-row {
    display: flex;
    gap: 8px;
    margin: 8px 14px 0;
  }
  .cat-row[hidden] { display: none; }
  .cat-row a {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: 1px solid var(--accent-strong);
    background: rgba(255, 204, 51, 0.1);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 5px;
    font-size: 11.5px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
  }
  .cat-row a:hover { background: rgba(255, 204, 51, 0.3); }
  /* 394 - 30 = 364, so the popup body stays at exactly 575px whether the
     row is there or not. Measured, not guessed. */
  body.axis-has-categories .view-area {
    height: 364px;
  }
  .view-area {
    /* 430px before the .link-row was added above the tabs; trimmed by the
       row's height so the popup stays under Chrome's 600px popup cap.
       Body height with this: 575px. */
    height: 394px;
    margin-top: 10px;
    border-top: 1px solid var(--border);
    overflow: hidden;
  }
  .view {
    display: none;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  .view.active {
    display: flex;
  }
  #fovMapCanvas {
    width: 100%;
    flex: 1 1 auto;
    /* The results list below has a fixed height, so the map takes whatever
       is left - but never less than this, or a wide cone becomes undrawable. */
    min-height: 150px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 10px 10px 0;
  }
  .fovmap-popup-hint-row {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin: 6px 10px 10px;
  }
  .fovmap-popup-step-text {
    flex: 1 1 auto;
    font-size: 10.5px;
    color: var(--muted);
    margin: 0;
    line-height: 1.3;
  }
  .fovmap-results-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .fovmap-results-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 10px 4px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 700;
  }
  .fovmap-results-count {
    font-weight: 400;
    color: var(--muted);
  }
  /* ---- Shared chipset filter / sort menu -----------------------------
     One button per list (search row + FoV results header), both opening
     the SAME #filterPop panel and writing the same state - filtering in
     one tab is meant to be visible in the other.

     The panel is position:fixed on purpose: every ancestor it would
     otherwise sit in (.view, .view-area) is overflow:hidden, which would
     clip a ~230px popover down to nothing. Fixed coordinates are computed
     from the button's rect in popup.js. */
  .filter-btn {
    flex: 0 0 auto;
    border: 1px solid var(--accent-strong);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    padding: 0 8px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .filter-btn:hover { background: var(--row-hover); }
  .filter-btn.active { background: var(--accent); border-color: var(--text); }
  /* The FoV results header version is a plain inline button in a text row,
     not a full-height field neighbour like the one in the search panel. */
  .fovmap-results-head .filter-btn {
    padding: 2px 7px;
    font-size: 11px;
    background: rgba(255, 204, 51, 0.2);
  }
  .fovmap-results-head .filter-btn:hover { background: rgba(255, 204, 51, 0.35); }
  .fovmap-results-head .filter-btn.active { background: var(--accent); }
  .filter-btn .filter-count {
    background: var(--header-bg);
    color: var(--accent);
    border-radius: 8px;
    padding: 0 4px;
    font-size: 9.5px;
    line-height: 14px;
  }
  .filter-pop {
    position: fixed;
    /* Above the map. This was set when the map was Leaflet, whose panes and
       controls climb to 1000 in the root stacking context and drew straight
       over this panel at z-index 50. MapLibre's own chrome sits far lower,
       but the generous value costs nothing and keeps the popover safe. */
    z-index: 10000;
    width: 214px;
    background: var(--bg);
    border: 1px solid var(--accent-strong);
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    padding: 8px;
    font-size: 12px;
  }
  .filter-pop[hidden] { display: none; }
  .filter-pop .filter-sec {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin: 2px 0 5px;
  }
  .filter-pop label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 2px;
    cursor: pointer;
  }
  .filter-pop label:hover { background: var(--row-hover); border-radius: 4px; }
  .filter-pop input { margin: 0; flex: 0 0 auto; }
  .filter-pop hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 8px 0;
  }
  .filter-pop .filter-foot {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
  }
  .filter-pop .filter-foot button {
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .filter-pop .filter-foot button:hover { color: var(--text); }
  #fovMapResults {
    flex: 0 0 152px;
    overflow-y: auto;
    padding: 0 6px 6px;
  }
  /* One line per match: model on the left, chipset/price/heart badges
     right-floated exactly like .row in the Chipset & MSRP list. */
  #fovMapResults .row {
    padding: 4px 8px;
  }
  #fovMapResults .row .model {
    font-size: 11.5px;
    /* One line per row: the model name truncates rather than wrapping under
       the right-floated badges. */
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #fovMapResults .row .sku {
    font-weight: 400;
    font-size: 10.5px;
    color: var(--muted);
  }
  #fovMapResetBtn, #fovMapBtn {
    flex: 0 0 auto;
    border: 1px solid var(--accent-strong);
    background: rgba(255, 204, 51, 0.2);
    color: var(--accent-ink);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  #fovMapResetBtn:hover, #fovMapBtn:hover {
    background: var(--accent);
  }
  #fovMapBtn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent-strong);
  }

  /* Big yellow tab buttons (Chipset & MSRP / FoV Map / IP Utility), equal
     width side by side above .view-area. Required angle slider lives
     inside the Catalogue view below, not here - same split as content.js's Filters
     panel, where the map itself carries no controls beyond click/drag, and
     the angle requirement can also be set by drawing a cone on the map. */
  .fovmap-toggle-btn {
    width: calc(100% - 28px);
    margin: 10px 14px 0;
    border: 1px solid var(--accent-strong);
    background: rgba(255, 204, 51, 0.2);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .findcams-popup-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 10px 0;
    font-weight: 700;
    font-size: 12.5px;
    white-space: nowrap;
  }
  #findCamsPageBtn {
    border: 1px solid var(--accent-strong);
    background: rgba(255, 204, 51, 0.2);
    color: var(--accent-ink);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  #findCamsPageBtn:hover { background: var(--accent); }
  #findCamsMount {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
  .view-tabs .fovmap-toggle-btn {
    flex: 1 1 0;
    width: auto;
    margin: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    padding: 7px 5px 6px;
  }
  .view-tabs .tab-icon {
    display: block;
    flex: 0 0 auto;
  }
  .view-tabs .tab-label {
    /* Buttons don't inherit the page font by default (Chrome falls back
       to system-ui), which is wider than the body's Arial and makes the
       labels look different from the rest of the popup - so inherit it
       explicitly. Every label is two deliberate lines ("Chipset &" /
       "MSRP"): the translation strings carry a \n and pre-line renders
       it, so the three tabs always have the same height and no line
       ever has to fit the whole name in the ~114px a tab gets at 420px. */
    font-family: inherit;
    font-size: 12px;
    line-height: 1.2;
    white-space: pre-line;
  }
  .fovmap-toggle-btn:hover {
    background: rgba(255, 204, 51, 0.35);
  }
  .fovmap-toggle-btn.active {
    background: var(--accent);
    border-color: var(--text);
  }
  .angle-row {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }
  /* Label, slider and value on one line. The slider used to take a line of
     its own below the label, which cost ~22px of a fixed-height popup for
     no information - the list below is what that space is for. */
  .angle-label-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  #angleFieldLabel { flex: 0 0 auto; }
  .angle-value-group {
    display: flex;
    align-items: center;
    gap: 3px;
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 12px;
    color: var(--muted);
  }
  #angleValueInput {
    width: 44px;
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 12px;
    color: var(--text);
    text-align: right;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    background: var(--bg);
    -moz-appearance: textfield;
  }
  #angleValueInput::-webkit-outer-spin-button,
  #angleValueInput::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  #angleSlider {
    /* Takes the slack between the label and the value. min-width:0 because
       a flex item will not shrink below its intrinsic width without it, and
       a range input's intrinsic width would push the value group off. */
    flex: 1 1 auto;
    min-width: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  /* CSS-only markers (no image files) for the same reason content.js uses
     them on the Product Selector page: avoids fighting Leaflet's default
     icon-path auto-detection inside a bundled script context. */
  .axis-fovmap-edge-handle {
    width: 14px; height: 14px; border-radius: 50%;
    background: #e0b400; border: 2px solid #fff;
    box-shadow: 0 0 2px rgba(0, 0, 0, 0.6); cursor: grab;
  }
  .axis-fovmap-edge-handle:active { cursor: grabbing; }
  .axis-fovmap-camera-icon {
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; background: #1a1a1a; border: 2px solid #fff;
    border-radius: 50%; box-shadow: 0 0 3px rgba(0, 0, 0, 0.6); cursor: grab;
  }
  .axis-fovmap-camera-icon:active { cursor: grabbing; }

  /* The advanced drawer's four update rows and the disclaimer moved to the
     Settings page (options.html) - #advancedBtn opens it now. What is left
     in the drawer is Language and Currency, which stay in the popup because
     they change what the list in front of you shows. */
  .language-flags {
    /* 12 flags as two even rows of six (a wrapping flexbox fell 7 + 5). */
    display: grid;
    grid-template-columns: repeat(6, max-content);
    gap: 6px;
    margin-top: 6px;
  }
  .language-flags button {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 15px;
    line-height: 1.2;
    cursor: pointer;
  }
  .language-flags button.active {
    border-color: var(--accent-strong);
    background: rgba(255, 204, 51, 0.25);
  }
  #advancedBtn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent-strong);
  }

  /* Ko-fi header icon - styled to match its three siblings above (same
     border/padding/font-size) so it reads as one more toolbar button
     rather than an oversized emoji blob; the only thing that sets it
     apart is an orange tint and a heartbeat pulse - two quick beats then
     a rest, the way a real heart goes - so it's noticeable without being
     a distracting strobe. Hover stops it and drops the tint, so the
     button doesn't move under the cursor while you aim at it. */
  #kofiBtn {
    border-color: rgba(255, 138, 0, 0.75);
    background: rgba(255, 138, 0, 0.18);
    color: #ffb066;
    animation: kofi-heartbeat 2.4s ease-in-out infinite;
  }
  #kofiBtn:hover {
    animation-play-state: paused;
    transform: none;
    border-color: rgba(255, 138, 0, 0.95);
    background: rgba(255, 138, 0, 0.45);
    color: #fff;
  }
  @keyframes kofi-heartbeat {
    0%   { transform: scale(1);    background: rgba(255, 138, 0, 0.18); }
    8%   { transform: scale(1.16); background: rgba(255, 138, 0, 0.5); }
    16%  { transform: scale(1);    background: rgba(255, 138, 0, 0.18); }
    24%  { transform: scale(1.12); background: rgba(255, 138, 0, 0.42); }
    34%, 100% { transform: scale(1); background: rgba(255, 138, 0, 0.18); }
  }
  /* Respect a system "reduce motion" preference - the orange tint alone
     still makes the button stand out. */
  @media (prefers-reduced-motion: reduce) {
    #kofiBtn { animation: none; }
  }

/* Basemap unavailable (tile provider refused us) - a plain graticule so the
   map area still reads as a map surface, plus a one-line note. The coverage
   wedge, the pin and the handles are all drawn by us on top of this. */
.maplibregl-map.axis-map-nobasemap {
  background-color: #eef1f3;
  background-image:
    linear-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 0, 0, 0.06) 1px, transparent 1px);
  background-size: 32px 32px;
}
.axis-map-nobasemap-note {
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  z-index: 500;
  max-width: 92%;
  padding: 5px 10px;
  border: 1px solid #e0b400;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.94);
  color: #1a1a1a;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  pointer-events: none;
}

html[data-theme="dark"] .maplibregl-map.axis-map-nobasemap {
  background-color: #242424;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
}
html[data-theme="dark"] .axis-map-nobasemap-note {
  background: rgba(30, 30, 30, 0.94);
  color: #f0f0f0;
}

    /* OS 13 row carries two controls (Update + On/Off) where the other
       settings rows carry one - keep them from colliding. */
    .os13-buttons { display: inline-flex; gap: 6px; align-items: center; }

    /* AXIS OS 13 pill in the catalogue rows. Floated right like .chipset and
       .price, because this row lays its columns out with floats, not flex -
       an unfloated pill drops into normal flow and shoves the model name onto
       a second line. Fixed width for the same reason the others have one: two
       variable-width floats can never share a stable left edge.
       ".os13.none" is an invisible spacer so rows without a verdict keep the
       chipset and price columns aligned with the rows that have one. */
    .row .os13, .os13 {
      float: right;
      display: inline-block;
      margin-right: 6px;
      padding: 1px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      min-width: 58px;
      text-align: left;
    }
    /* Tinted and outlined rather than filled, matching toolbox.4xs.dev's
       catalogue. Nearly every model in this list is OS 13 with a DLPU, so a
       saturated chip on almost every row is noise that buries the thing
       worth seeing - the exceptions. Low weight by default lets a 🚫 or an
       MLPU stand out by contrast.
       The badges injected onto axis.com (content.css, products-content.css,
       search-content.css) deliberately stay saturated: those have to win
       against Axis's own page design, where a light tint would vanish.
       The outline is an inset shadow, not a border, so it cannot change the
       pill's box and shift these float:right columns. */
    .os13.yes  { background: #eef6ee; color: #4b8a50; box-shadow: inset 0 0 0 1px currentColor; }
    .os13.no   { background: #fbeeee; color: #b05454; box-shadow: inset 0 0 0 1px currentColor; }
    .os13.none { background: transparent; box-shadow: none; }
    [data-theme="dark"] .os13.yes { background: rgba(123, 196, 127, 0.12); color: #8fcf93; }
    [data-theme="dark"] .os13.no  { background: rgba(240, 138, 138, 0.12); color: #f09a9a; }

    /* Compute-capability pill, floated like .os13 / .chipset / .price so the
       row keeps its column alignment. ".compute.none" is an invisible spacer
       for rows we have no compute data for. */
    .row .compute, .compute {
      float: right; display: inline-block; margin-right: 6px; padding: 1px 8px;
      border-radius: 3px; font-size: 11px; font-weight: 700; letter-spacing: .02em;
      white-space: nowrap; min-width: 54px; text-align: left;
    }
    .compute.dlpu { background: #eaf2fa; color: #477fb3; box-shadow: inset 0 0 0 1px currentColor; }
    .compute.mlpu { background: #f3edfc; color: #8a63c9; box-shadow: inset 0 0 0 1px currentColor; }
    .compute.nope { background: #f2f2f2; color: #8a8a8a; box-shadow: inset 0 0 0 1px currentColor; }
    .compute.none { background: transparent; box-shadow: none; }
    /* Same invisible-spacer idea for a model Axis publishes no chipset for:
       the column stays, so the price keeps its place at the right of line 1
       and the OS 13 / compute pills stay on line 2. */
    .chipset.none { background: transparent; box-shadow: none; }
    [data-theme="dark"] .compute.dlpu { background: rgba(111, 182, 240, 0.12); color: #85c2f2; }
    [data-theme="dark"] .compute.mlpu { background: rgba(167, 139, 230, 0.12); color: #b79af0; }
    [data-theme="dark"] .compute.nope { background: rgba(168, 168, 168, 0.12); color: #a8a8a8; }

    /* Catalogue-row badge block: the chipset / OS 13 / compute pills share
       one line, and the price takes the line below it on its own, which is
       what lets the price be the biggest thing in the block - it is the
       number people actually scan for.
       A flex row that wraps, not a fixed grid: the three pills are optional
       (Settings switches each one off independently), so the ones that are
       left have to close ranks to the left instead of leaving a hole where
       a disabled badge used to be. --badges-w is set by popup.js from the
       switched-on set, so every row still reserves exactly the same width
       and the pills line up down the list. */
    .row .badges {
      float: right;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      gap: 3px 4px;
      width: var(--badges-w, 192px);
      margin-left: 10px;
    }
    /* Inside the block the pills are flex items, not floats. Fixed widths,
       because that is what lines them up from row to row - measured
       headlessly against every label these three can render. `order` puts
       the chipset and the price on the first line and the OS 13 and compute
       pills on the second, whichever of them are switched on: flex-wrap
       packs whatever is left to the left instead of leaving a gap. */
    .row .badges > .chipset,
    .row .badges > .os13,
    .row .badges > .compute,
    .row .badges > .price {
      float: none;
      margin-right: 0;
      min-width: 0;
      box-sizing: border-box;
      font-size: 10px;
      padding: 1px 6px;
      /* Centred as a flex line rather than left to the text baseline: the
         ✅ / 🚫 in the OS 13 pill is an emoji with a taller line box than
         plain text, so on a shared baseline "OS13" and "DLPU" sat at
         different heights. line-height:1 takes the glyph's own leading out
         of it so both pills centre on the same axis. */
      display: flex;
      align-items: center;
      line-height: 1;
    }
    /* 92px covers every chipset label but the two-SoC ones ("ARTPEC-8 (x2)
       ✅", 113px). Those ellipsize rather than clip, and the pill's title
       already carries the full value. */
    .row .badges > .chipset {
      order: 1; width: 92px; overflow: hidden; text-overflow: ellipsis;
    }
    .row .badges > .os13    { order: 3; width: 68px; }
    .row .badges > .compute { order: 4; width: 72px; }
    /* The price is the value people scan this list for, so it is the one
       thing here set bigger than the pills, and margin-left:auto parks it at
       the right end of the first line. */
    .row .badges > .price {
      order: 2;
      width: 96px;
      margin-left: auto;
      font-size: 13px;
      padding: 1px 7px;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* A row with no price of its own keeps the cell, so the rows that do
       have one stay aligned. With prices switched off entirely the cell is
       not rendered at all - every row loses it together. */
    .row .badges > .price.none { background: transparent; }
</style>
